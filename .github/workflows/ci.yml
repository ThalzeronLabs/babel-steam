name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test tests/Babel.Tests -c Release
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Test the page script
        run: node tests/web/pagina.test.mjs
      - name: Publish (self-contained, one file)
        run: dotnet publish src/Babel -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out/win-x64
      - name: Smoke test the exe
        shell: pwsh
        run: |
          $p = Start-Process out/win-x64/Babel.exe -ArgumentList 'help' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Babel.exe help exited with $($p.ExitCode)" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Babel-win-x64
          path: out/win-x64/Babel.exe
