name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test tests/Babel.Tests -c Release
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Test the page script
        run: node tests/web/pagina.test.mjs
      - name: Build both flavors
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'
          dotnet publish src/Babel -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out/self
          dotnet publish src/Babel -c Release -r win-x64 --no-self-contained -p:PublishSingleFile=true -o out/framework
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path out/self/Babel.exe, LICENSE, THIRD-PARTY-NOTICES.txt, README.md -DestinationPath "dist/Babel-$v-win-x64.zip"
          Compress-Archive -Path out/framework/Babel.exe, LICENSE, THIRD-PARTY-NOTICES.txt, README.md -DestinationPath "dist/Babel-$v-win-x64-framework.zip"
          Get-ChildItem dist/*.zip | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ github.ref_name }}'
          $notes = (Get-Content CHANGELOG.md -Raw) -split "(?m)^## " | Where-Object { $_ -like "$($v.TrimStart('v'))*" } | Select-Object -First 1
          $sums = Get-Content dist/SHA256SUMS.txt -Raw
          "## $notes`n### SHA-256`n``````text`n$sums``````" | Set-Content notes.md
          gh release create $v dist/*.zip dist/SHA256SUMS.txt --title "Babel para Steam $v" --notes-file notes.md
